<section class="section-container">
    <h1>Map</h1>
    <p>Locate your meetings in a few seconds. Add events and edit them in one click.</p>
    <app-mapbox-map [locations] = "meetings()" (mapClick)="onMapClick($event)" (editMeeting)="updateMeeting($event)"></app-mapbox-map>
    <app-dialog-form #dialogForm (save)="saveMeeting($event)"></app-dialog-form>
</section>
